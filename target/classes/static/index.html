<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Bela Vista - Reserva de Quartos</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --accent: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            padding: 2rem;
        }

        .card-title {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #334155;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert ul {
            margin-left: 1.25rem;
            margin-top: 0.5rem;
        }

        .reservas-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .reservas-table th, .reservas-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .reservas-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏨 Hotel Bela Vista</h1>
        <p>Sistema de Reservas - Integração com Spring Boot Backend</p>
    </div>

    <div class="container">
        <div class="card">
            <h2 class="card-title">📝 Formulário de Reserva</h2>

            <div id="alertSuccess" class="alert alert-success"></div>
            <div id="alertError" class="alert alert-error"></div>

            <form id="hotelForm">
                <div class="form-group">
                    <label for="nome">Nome Completo do Hóspede *</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Carlos Silva" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF do Hóspede *</label>
                    <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataChegada">Data de Chegada (Check-in) *</label>
                        <input type="date" id="dataChegada" name="dataChegada" required>
                    </div>

                    <div class="form-group">
                        <label for="numeroNoites">Número de Noites *</label>
                        <input type="number" id="numeroNoites" name="numeroNoites" min="1" max="365" value="1" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn">Confirmar Reserva</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">📋 Reservas Confirmadas no Backend</h2>
            <div id="tabelaContainer" style="overflow-x: auto;">
                <p id="semReservas" style="color: var(--text-muted); text-align: center; padding: 1rem;">Nenhuma reserva registrada ainda.</p>
                <table class="reservas-table" id="tabelaReservas" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Hóspede</th>
                            <th>CPF</th>
                            <th>Chegada</th>
                            <th>Noites</th>
                            <th>Saída</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('hotelForm');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const submitBtn = document.getElementById('submitBtn');
        const dataChegadaInput = document.getElementById('dataChegada');
        const cpfInput = document.getElementById('cpf');

        const hoje = new Date().toISOString().split('T')[0];
        dataChegadaInput.min = hoje;
        dataChegadaInput.value = hoje;

        cpfInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.substring(0, 11);
            if (v.length > 9) {
                v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            } else if (v.length > 6) {
                v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            } else if (v.length > 3) {
                v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            }
            e.target.value = v;
        });

        const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        const apiUrl = basePath + 'api/reservas';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            esconderAlertas();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                cpf: document.getElementById('cpf').value.trim(),
                dataChegada: document.getElementById('dataChegada').value,
                numeroNoites: parseInt(document.getElementById('numeroNoites').value, 10)
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarSucesso(`✅ Reserva #${data.id} cadastrada com sucesso para <strong>${data.nome}</strong>! Check-in: <strong>${data.dataChegada}</strong>, Check-out previsto: <strong>${data.dataSaida}</strong> (${data.numeroNoites} noite(s)).`);
                    form.reset();
                    dataChegadaInput.value = hoje;
                    document.getElementById('numeroNoites').value = 1;
                    carregarReservas();
                } else {
                    let mensagemErro = `<strong>Erro ao processar reserva:</strong> ${data.erro || 'Falha na requisição'}`;
                    if (data.detalhes) {
                        mensagemErro += '<ul>';
                        for (const [campo, erro] of Object.entries(data.detalhes)) {
                            mensagemErro += `<li><strong>${campo}:</strong> ${erro}</li>`;
                        }
                        mensagemErro += '</ul>';
                    }
                    mostrarErro(mensagemErro);
                }
            } catch (err) {
                mostrarErro('❌ Erro de conexão com o backend Spring Boot no Tomcat. Verifique se o servidor está ativo.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirmar Reserva';
            }
        });

        async function carregarReservas() {
            try {
                const res = await fetch(apiUrl);
                if (!res.ok) return;
                const reservas = await res.json();

                const tabela = document.getElementById('tabelaReservas');
                const corpo = document.getElementById('corpoTabela');
                const semReservas = document.getElementById('semReservas');

                if (reservas && reservas.length > 0) {
                    corpo.innerHTML = '';
                    reservas.forEach(r => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><span class="badge">#${r.id}</span></td>
                            <td><strong>${r.nome}</strong></td>
                            <td>${r.cpf}</td>
                            <td>${r.dataChegada}</td>
                            <td>${r.numeroNoites} noite(s)</td>
                            <td><strong>${r.dataSaida}</strong></td>
                        `;
                        corpo.appendChild(tr);
                    });
                    tabela.style.display = 'table';
                    semReservas.style.display = 'none';
                } else {
                    tabela.style.display = 'none';
                    semReservas.style.display = 'block';
                }
            } catch (e) {
                console.warn('Não foi possível carregar as reservas existentes:', e);
            }
        }

        function mostrarSucesso(html) {
            alertSuccess.innerHTML = html;
            alertSuccess.style.display = 'block';
        }

        function mostrarErro(html) {
            alertError.innerHTML = html;
            alertError.style.display = 'block';
        }

        function esconderAlertas() {
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
        }

        carregarReservas();
    </script>
</body>
</html>
